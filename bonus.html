<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Bonus | Rade &amp; Co Publishing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: "Manrope", sans-serif; background: linear-gradient(180deg, #fffdf9 0%, #fbf6ef 100%); color: #2d2926; }
        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .card { width: min(100%, 620px); padding: 2rem; border-radius: 28px; background: rgba(255,255,255,0.9); border: 1px solid rgba(45,41,38,0.08); box-shadow: 0 22px 45px rgba(55,41,34,0.08); }
        h1,h2 { margin: 0 0 .8rem; font-family: "Cormorant Garamond", serif; line-height: 1.05; }
        h1 { font-size: clamp(2.4rem, 5vw, 4rem); }
        p { color: #726457; }
        form { display: grid; gap: 1rem; margin-top: 1.5rem; }
        input { width: 100%; padding: .95rem 1rem; border-radius: 16px; border: 1px solid rgba(45,41,38,.1); font: inherit; }
        button { border: 0; border-radius: 999px; padding: 1rem 1.3rem; background: #2d2926; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .status { min-height: 1.5rem; color: #726457; }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card">
            <p id="eyebrow">Free bonus</p>
            <h1 id="bonusTitle">Claim your free bonus</h1>
            <p id="bonusIntro">Enter your name and email to have the free bonus sent to your inbox.</p>
            <form id="bonusForm">
                <input type="text" name="name" placeholder="Your name" required>
                <input type="email" name="email" placeholder="Your email" required>
                <button type="submit">Email My Free Bonus</button>
                <p class="status" id="bonusStatus"></p>
            </form>
        </section>
    </main>

    <script src="assets/js/site-config.js"></script>
    <script src="assets/js/book-library.js"></script>
    <script src="assets/js/content-store.js"></script>
    <script>
        const store = window.RADE_CONTENT_STORE;
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        const bonusTitle = document.getElementById("bonusTitle");
        const bonusIntro = document.getElementById("bonusIntro");
        const bonusStatus = document.getElementById("bonusStatus");
        let currentBook = null;

        async function init() {
            if (!slug) {
                return;
            }
            currentBook = await store.getBookBySlug(slug);
            if (currentBook) {
                bonusTitle.textContent = currentBook.freeBonusTitle ? `Claim the ${currentBook.freeBonusTitle}` : `Claim your free bonus for ${currentBook.title}`;
                bonusIntro.textContent = `Enter your name and email and we'll send your bonus for ${currentBook.title}.`;
            }
        }

        document.getElementById("bonusForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = new FormData(event.currentTarget);
            bonusStatus.textContent = "Sending...";
            try {
                await fetch("api/public/subscribers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: data.get("name"),
                        email: data.get("email"),
                        source: "Free Bonus",
                        bookSlug: currentBook ? currentBook.slug : slug,
                        bonusTitle: currentBook ? currentBook.freeBonusTitle : "Free Bonus",
                        bonusUrl: currentBook ? currentBook.freeBonusFileUrl : ""
                    })
                });
                window.location.href = "bonus-thank-you.html";
            } catch (error) {
                bonusStatus.textContent = "We couldn't send that right now. Please try again.";
            }
        });

        init();
    </script>
</body>
</html>
