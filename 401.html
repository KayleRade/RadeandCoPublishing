<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops | Rade &amp; Co Publishing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: "Manrope", sans-serif; background: linear-gradient(180deg, #fffdf9 0%, #fbf6ef 100%); color: #2d2926; }
        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .card { width: min(100%, 700px); padding: 2.2rem; border-radius: 30px; background: rgba(255,255,255,.92); border: 1px solid rgba(45,41,38,.08); box-shadow: 0 22px 45px rgba(55,41,34,.08); text-align: center; }
        h1 { margin: 0 0 .8rem; font-family: "Cormorant Garamond", serif; font-size: clamp(2.6rem, 7vw, 4.6rem); }
        p { color: #726457; font-size: 1.05rem; }
        a { display: inline-flex; margin-top: 1rem; padding: 1rem 1.3rem; border-radius: 999px; background: #2d2926; color: #fff; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card">
            <h1>Ooops, something went wrong...</h1>
            <p>The page wandered off like a distracted book club member. Let's get you back to the good part.</p>
            <a href="index.html">Return Home</a>
        </section>
    </main>
</body>
</html>
