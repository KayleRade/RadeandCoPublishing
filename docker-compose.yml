services:
  radeco-site:
    build: .
    container_name: radeco-site
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - radeco_uploads:/app/uploads
      - radeco_analytics:/app/data

volumes:
  radeco_uploads:
  radeco_analytics:
